name = "whoop-mcp"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `npx wrangler secret put <NAME>`):
#   WHOOP_CLIENT_ID, WHOOP_CLIENT_SECRET, MCP_BEARER_TOKEN
# Optional var: WHOOP_REDIRECT_URI (defaults to https://<worker>/auth/callback)

[[kv_namespaces]]
binding = "TOKENS"
id = "eef9f254b56f4888a2010a0d0fccb78b"   # from: npx wrangler kv namespace create TOKENS

[observability]
enabled = true
